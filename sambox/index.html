<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SamBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&display=swap">
<style>
  /* SamBox · index.html · Ảnh mô phỏng đích: ba đảo trống. Cảnh 3D phủ màn hình; bảng nổi ở trên (tên, chọn đảo, chọn buổi) và góc
     dưới (mức đồ hoạ, khung hình/giây). */
  :root {
    --panel: rgba(255, 250, 246, 0.82);
    --ink: #2b2433;
    --muted: #6a5f74;
    --line: rgba(43, 36, 51, 0.14);
    --accent: #7a5cc8;
    --accent-ink: #ffffff;
    --font: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) { --panel: rgba(30, 26, 40, 0.8); --ink: #f1ecf7; --muted: #b8aec6; --line: rgba(241, 236, 247, 0.16); --accent: #a68cf0; --accent-ink: #160f24; }
  }
  :root[data-theme='dark'] { --panel: rgba(30, 26, 40, 0.8); --ink: #f1ecf7; --muted: #b8aec6; --line: rgba(241, 236, 247, 0.16); --accent: #a68cf0; --accent-ink: #160f24; }
  html, body { height: 100%; margin: 0; }
  body { background: #2a2140; color: var(--ink); font-family: var(--font); overflow: hidden; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .bar { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); display: flex; flex-wrap: wrap; gap: 8px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
  .bar > * { pointer-events: auto; }
  .name { background: var(--panel); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 7px 12px; }
  .name b { display: block; font-size: 16px; font-weight: 700; letter-spacing: 0.02em; }
  .name span { font-size: 12px; color: var(--muted); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  button { font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: transparent; border: 0; border-radius: 8px; padding: 7px 11px; cursor: pointer; }
  button:hover { background: var(--line); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.on { background: var(--accent); color: var(--accent-ink); }
  .foot { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: center; }
  .foot .seg { padding: 4px 6px; align-items: center; font-size: 12px; color: var(--muted); }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 15px; color: #f1ecf7; pointer-events: none; }
  @media (max-width: 560px) { .name span { display: none; } }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="loading">Đang dựng ba đảo…</div>
<div class="bar">
  <div class="name"><b>SamBox</b><span>Ảnh mô phỏng đích · ba đảo trống</span></div>
  <div class="seg" id="islands" aria-label="Chọn đảo"></div>
  <div class="seg" id="daytimes" aria-label="Chọn buổi"></div>
</div>
<div class="foot">
  <div class="seg"><button type="button" id="quality">Đồ hoạ</button></div>
  <div class="seg" id="fps">…</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module">
  import('./src/main.js').then(() => document.getElementById('loading').remove()).catch((e) => {
    document.getElementById('loading').textContent = 'Lỗi khi dựng cảnh: ' + e.message;
    console.error(e);
  });
</script>
</body>
</html>
