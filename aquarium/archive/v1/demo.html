<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Bố cục: cả màn hình là bể kính 3D. Băng thời đại ở trên, thanh thời gian ở dưới, bảng kế hoạch trượt từ bên phải.
   Một thế giới tối duy nhất (bầu trời trong bể), mọi màu đặt rõ ràng. */
:root {
  --bg: #0b1430; --ink: #f5f1e8; --dim: rgba(245, 241, 232, 0.72); --faint: rgba(245, 241, 232, 0.5);
  --glass: rgba(12, 19, 34, 0.66); --line: rgba(255, 255, 255, 0.15); --chip: rgba(255, 255, 255, 0.07);
  --amber: #ffd27a; --violet: #c3a6ff; --cyan: #7ff0ff; --rose: #ff9b8f; --good: #8fe0b2;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
.glass { background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

.brand { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); pointer-events: none; text-shadow: 0 2px 16px rgba(0, 0, 0, 0.45); }
.brand h1 { margin: 0; font: 700 clamp(24px, 3vw, 36px)/1 var(--font-display); letter-spacing: -0.01em; }
.brand p { display: inline-block; margin: 6px 0 0; padding: 3px 9px; border-radius: 999px; background: rgba(12, 19, 34, 0.6); font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); text-shadow: none; }

.era { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 14px); width: min(560px, calc(100vw - 32px)); border-radius: 18px; padding: 10px 16px 11px; display: grid; gap: 2px; text-align: center; }
.era .k { font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); font-variant-numeric: tabular-nums; }
.era b { font: 700 24px/1.1 var(--font-display); text-wrap: balance; }
.era span { font-size: 13.5px; color: var(--dim); text-wrap: balance; }

.timebar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); width: min(760px, calc(100vw - 32px)); border-radius: 20px; padding: 10px 14px 8px; display: grid; gap: 6px; }
.tb-row { display: flex; align-items: center; gap: 10px; }
.tb-row button { border: 1px solid var(--line); background: var(--chip); border-radius: 999px; padding: 8px 14px; cursor: pointer; white-space: nowrap; font-weight: 600; font-size: 13.5px; }
.tb-row button:hover { background: rgba(255, 255, 255, 0.14); }
.tb-row button.go { background: var(--amber); color: #2a1d05; border-color: var(--amber); }
.tb-row button[aria-pressed="true"] { background: rgba(255, 210, 122, 0.24); border-color: var(--amber); }
#eraRange { flex: 1; min-width: 0; accent-color: #ffd27a; }
.ticks { display: grid; grid-template-columns: repeat(12, 1fr); font-size: 10.5px; color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
.ticks i { font-style: normal; }
.ticks i.on { color: var(--amber); font-weight: 600; }
.ticks i.beyond { color: var(--violet); }

.plan-btn { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 14px); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.plan { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 62px); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); width: min(400px, calc(100vw - 32px)); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; }
.tabs { display: flex; gap: 4px; padding: 10px 10px 0; flex-wrap: wrap; }
.tabs button { flex: 1 1 auto; border: 0; background: var(--chip); border-radius: 10px; padding: 7px 8px; cursor: pointer; font-weight: 600; font-size: 12.5px; }
.tabs button[aria-selected="true"] { background: rgba(255, 210, 122, 0.22); box-shadow: inset 0 0 0 1px rgba(255, 210, 122, 0.55); }
.pb { overflow-y: auto; padding: 10px 14px 16px; display: grid; gap: 10px; align-content: start; min-height: 0; }
.pb h3 { margin: 4px 0 0; font: 700 19px/1.15 var(--font-display); text-wrap: balance; }
.pb h4 { margin: 6px 0 0; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
.pb p { margin: 0; color: var(--dim); font-size: 13.5px; }
.pb ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.pb li { font-size: 13.5px; color: var(--dim); }
.pb li b { color: var(--ink); font-weight: 600; }
.tl { display: grid; gap: 4px; }
.tl div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 8px; border-radius: 10px; background: var(--chip); font-size: 13px; color: var(--dim); }
.tl div b { color: var(--ink); font-weight: 600; }
.tl div em { font-style: normal; color: var(--amber); font-variant-numeric: tabular-nums; font-size: 12px; }
.tl div.beyond em { color: var(--violet); }
.tl div.now { box-shadow: inset 0 0 0 1px var(--amber); }
.reg { display: grid; gap: 6px; padding: 10px; border-radius: 12px; background: var(--chip); }
.reg-h { display: flex; align-items: center; gap: 8px; }
.reg-h i { width: 11px; height: 11px; border-radius: 3px; }
.reg-h b { flex: 1; font-size: 14.5px; }
.reg-h button, .ev button { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.1); border-radius: 999px; padding: 5px 11px; cursor: pointer; font-weight: 600; font-size: 12px; }
.reg-h button:hover, .ev button:hover { background: rgba(255, 255, 255, 0.2); }
.reg ol { margin: 0; padding-left: 18px; display: grid; gap: 3px; font-size: 12.5px; color: var(--dim); }
.reg ol b { color: var(--ink); font-weight: 600; }
.ev { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--chip); }
.ev b { font-size: 13.5px; }
.ev small { grid-column: 1; font-size: 12px; color: var(--dim); }
.ev button { grid-row: 1 / span 2; grid-column: 2; }
.mock { display: grid; gap: 8px; padding: 12px; border-radius: 14px; background: linear-gradient(180deg, #2a3f63, #4d6c8f); }
.mock .row { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: #eaf2ff; }
.mock .bar { display: flex; gap: 6px; justify-content: center; }
.mock .bar span { padding: 6px 10px; border-radius: 999px; background: rgba(12, 19, 34, 0.7); font-size: 11.5px; color: #f5f1e8; }
.mock .bar span.m { box-shadow: inset 0 0 0 1px #ffd27a; }
.drop li b { text-decoration: line-through; text-decoration-color: var(--rose); }

.label { position: fixed; transform: translate(-50%, -100%); pointer-events: none; padding: 3px 8px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; background: rgba(12, 19, 34, 0.78); border: 1px solid var(--line); }
.label small { display: block; font-weight: 400; color: var(--dim); font-size: 11px; }
.flash { position: fixed; left: 50%; top: 27%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); padding: 26px 28px; border-radius: 50%; background: radial-gradient(closest-side, rgba(8, 12, 24, 0.62), rgba(8, 12, 24, 0)); text-align: center; pointer-events: none; opacity: 0; transition: opacity 0.6s; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55); }
@media (min-width: 761px) { body.po .flash { left: calc(50% - 200px); } }
.flash.on { opacity: 1; }
.flash small { display: block; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); }
.flash b { font: 700 clamp(26px, 4vw, 44px)/1.08 var(--font-display); text-wrap: balance; }
.flash span { display: block; margin-top: 6px; color: var(--dim); font-size: 15px; }
.err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--dim); }

@media (max-width: 760px) {
  .brand p { display: none; }
  .era { top: calc(env(safe-area-inset-top, 0px) + 56px); padding: 8px 12px; }
  .era b { font-size: 19px; }
  .era span { font-size: 12.5px; }
  .plan { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); height: 52vh; }
  .ticks { font-size: 9px; }
  .tb-row button { padding: 7px 10px; font-size: 12.5px; }
  #autoBtn { display: none; }
}
@media (prefers-reduced-motion: reduce) { .flash { transition: none; } }
</style>

    if (v) {
      const k = v.dataset.ev; if (window.innerWidth < 760) togglePlan(false);
      const go = {
        meteor: () => { announce('Sự kiện lạ', 'Mưa sao băng', 'Đá trời rơi xuống biển trong và đồi hoang, để lại hố và quặng lạ.'); meteors(); },
        kraken: () => { announce('Sự kiện lạ', 'Quái vật biển', 'Xúc tu khổng lồ trồi lên, kéo một con tàu xuống đáy.'); kraken(); flyTo(new THREE.Vector3(14, 0, 6), 110); },
        rocket: () => { if (era < 6) setEra(6, false); announce('Thời tên lửa', 'Tên lửa chạm vòm kính', 'Cả bể biết mình đang ở trong một chiếc bể.'); launchRocket(true); flyTo(new THREE.Vector3(0, 40, 0), 260); },
        eclipse: () => { announce('Sự kiện lạ', 'Nhật thực giữa trưa', 'Trời tối sầm, cả sáu miền thắp đèn cầu khấn.'); eclipse(); },
        nano: () => { if (era < 8) setEra(8, false); announce('Thời vượt người', 'Bầy nano mất kiểm soát', 'Một đám mây hạt ăn trụi cả cánh rừng.'); nano(); },
        rift: () => { if (era < 10) setEra(10, false); announce('Thời vượt người', 'Vết nứt thời gian', 'Thành phố xưa hiện về, chồng lên thành phố hôm nay.'); timeRift(); },
        dino: () => { announce('Thời khủng long', 'Đàn khủng long chạy loạn', 'Cả đàn băng qua cầu dây sang làng bên.'); stampede(); },
        air: () => { if (era < 5) setEra(5, false); announce('Chiến tranh trên trời', 'Không chiến trên biển trong', 'Hai phi đội lượn vòng và bắn nhau.'); airBattle(); },
        portal: () => { announce('Chiến tranh qua cổng', 'Đổ quân vào giữa thành', 'Cổng không gian mở ngay trong thành Đá Mây.'); portalAssault(); },
      }[k];
      if (go) go();
    }
  });
  function togglePlan(open) { $('plan').hidden = !open; $('planBtn').setAttribute('aria-expanded', String(open)); document.body.classList.toggle('po', open); resize(); }
  $('planBtn').onclick = () => togglePlan($('plan').hidden);
  togglePlan(window.innerWidth >= 760);
  canvas.addEventListener('pointerdown', () => { controls.autoRotate = false; tween = null; });

  /* =============== Vòng lặp =============== */
  setEra(0, false); render();
  let last = now();
  function frame(t) {
    const dt = Math.min(100, t - last); last = t; const ts = t * 0.001;
    if (!reduce) { for (let i = 0; i < wpos.count; i++) { const x = wbase[i * 2], z = wbase[i * 2 + 1]; wpos.setY(i, Math.sin(x * 0.18 + ts * 1.1) * 0.16 + Math.cos(z * 0.21 + ts * 0.9) * 0.14); } wpos.needsUpdate = true; }
    moodStep(1 - Math.exp(-dt / 450));
    // làn sóng xây dựng
    for (const L of islands) {
      if (!L.anim) continue;
      const u = clamp((now() - L.anim.t0) / L.anim.dur, 0, 1);
      UNI[L.i].uWave.value = -4 + u * 40; OLD[L.i].uSink.value = Math.min(1, u * 1.8);
      if (u >= 1) { L.anim = null; UNI[L.i].uWave.value = 60; for (const m of L.oldMeshes || []) { L.g.remove(m); m.geometry.dispose(); } L.oldMeshes = []; for (const m of L.city) if (m.userData.kind === 0) m.castShadow = true; }
    }
    // thú
    for (const B of fauna) {
      if (!B.g.visible) continue;
      if (B.kind === 'plesio') { const a = B.ph + ts * B.sp * (B.j ? -1 : 1); B.g.position.set(Math.cos(a) * B.r, -0.4 + Math.sin(ts + B.j) * 0.2, Math.sin(a) * B.r); B.g.rotation.y = -a + (B.j ? 0 : Math.PI); B.legs.forEach((l, i) => { l.rotation.z = Math.sin(ts * 2 + i) * 0.4; }); continue; }
      if (B.kind === 'ptero' || B.kind === 'fly') { const a = B.ph + ts * B.sp * 2.4, rr = B.kind === 'ptero' ? 8 + B.j * 2 : 4 + B.j; const c = new THREE.Vector3(Math.cos(B.a0) * 22, 0, Math.sin(B.a0) * 22); B.g.position.set(c.x + Math.cos(a) * rr, (B.kind === 'ptero' ? 20 + B.j * 1.6 : 4 + Math.sin(ts * 3 + B.j)), c.z + Math.sin(a) * rr); B.g.rotation.y = -a; B.legs.forEach((w, i) => { w.rotation.z = Math.sin(ts * (B.kind === 'fly' ? 40 : 5) + i) * (B.kind === 'fly' ? 0.5 : 0.6) * (i % 2 ? 1 : -1); }); continue; }
      const a = B.a0 + Math.sin(ts * B.sp + B.ph) * 0.5, x = Math.cos(a) * B.r, z = Math.sin(a) * B.r, moving = Math.cos(ts * B.sp + B.ph);
      B.g.position.set(x, 0, z); B.g.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) * 0 + (-a + (moving > 0 ? 0 : Math.PI));
      const step = reduce ? 0 : Math.sin(ts * (B.kind === 'raptor' ? 9 : 3)) * (B.kind === 'croc' ? 0.3 : 0.45);
      B.legs.forEach((l, i) => { l.rotation.x = step * (i % 2 ? 1 : -1) * (i < 2 ? 1 : -1); });
      if (B.extra.neck) B.extra.neck.rotation.x = Math.sin(ts * 0.6 + B.ph) * 0.15;
    }
    // tàu, vệ tinh, mặt trời
    for (const s of ships) { if (s.held) continue; const a = s.ph + ts * s.sp; s.g.position.set(Math.cos(a) * s.r, s.hover ? 1.5 + Math.sin(ts + s.ph) * 0.3 : -0.4 + Math.sin(ts * 1.4 + s.ph) * 0.06, Math.sin(a) * s.r); s.g.rotation.y = -a + (s.sp > 0 ? Math.PI : 0); }
    for (const s of satellites) { if (!s.g.visible) continue; const a = s.ph + ts * s.sp; s.g.position.set(Math.cos(a) * s.r, s.h, Math.sin(a) * s.r); s.g.rotation.y = -a; }
    if (artSun.visible) { const k = 1 + Math.sin(ts * 1.4) * 0.04; artSun.scale.setScalar(k); }
    for (const f of floaters) f.m.position.y = f.y + (reduce ? 0 : Math.sin(ts * 0.5 + f.ph) * 1.4);
    // hiệu ứng
    const n2 = now();
    for (let i = fx.length - 1; i >= 0; i--) { const f = fx[i], ms = n2 - f.t0, u = clamp(ms / f.dur, 0, 1); try { f.update(u, ms); } catch (err) { u === u; } if (u >= 1) { fx.splice(i, 1); try { f.end(); } catch (err) { /* bỏ qua */ } } }
    if (tween) { const k = clamp((n2 - tween.t0) / 1300, 0, 1), e2 = 1 - Math.pow(1 - k, 3); const off = camera.position.clone().sub(controls.target); controls.target.lerpVectors(tween.from, tween.to, e2); off.setLength(tween.d0 + (tween.d1 - tween.d0) * e2); camera.position.copy(controls.target).add(off); if (k >= 1) tween = null; }
    controls.update();
    renderer.render(scene, camera);
    updateLabels();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__demo = { setEra, moment, meteors, kraken, timeRift, nano, eclipse, stampede, airBattle, portalAssault, launchRocket, flyTo, showLabels, islands, camera, controls };
})();
