<style>
/* Bể Kính, bản làm lại từ đầu: sáu đảo thô chỉ có thiên nhiên, thời tiết và phòng mẫu công trình theo mười hai thời đại.
   Cả màn hình là thế giới 3D, chữ và nút là lớp kính mỏng ở mép. */
:root {
  --ink: #f5f1e8; --title: #fffaf0; --title-dim: rgba(255, 250, 240, 0.8); --ink-dim: rgba(245, 241, 232, 0.72); --glass: rgba(14, 22, 38, 0.42); --glass-line: rgba(255, 255, 255, 0.16);
  --amber: #ffd27a; --bg: #0b1430;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
body.day { --title: #13233a; --title-dim: rgba(19, 35, 58, 0.78); --glass: rgba(14, 22, 38, 0.6); }
.brand, .clock { color: var(--title); transition: color 1.2s; pointer-events: none; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35); }
body.day .brand, body.day .clock { text-shadow: 0 1px 12px rgba(255, 255, 255, 0.55); }
.brand { position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 18px); }
.brand h1 { margin: 0; font: 700 clamp(30px, 4.4vw, 54px)/0.95 var(--font-display); letter-spacing: -0.01em; }
.clock { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px); text-align: right; }
.clock b { display: block; font: 500 clamp(26px, 3vw, 38px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock span { font-size: 13px; color: var(--title-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.lands { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
.lands button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: flex; gap: 7px; align-items: center; text-align: left; }
.lands button small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-dim); }
.lands button i { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.lands button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.16); }
.bar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; max-width: calc(100% - 24px); }
.bar button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.bar button:hover { background: rgba(255, 255, 255, 0.08); }
.bar button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.16); }
.bar .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--glass-line); }
.bar .era { display: flex; align-items: center; gap: 2px; }
.bar .era span { min-width: 9.5em; text-align: center; font-size: 13px; white-space: nowrap; }
.bar .era button { padding: 8px 10px; }
.bar .era .prog { min-width: 0; width: 64px; height: 6px; margin: 0 8px 0 4px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); overflow: hidden; flex: none; } /* phần tài nguyên đã gom cho thời sau */
@media (max-width: 720px) { .bar { flex-wrap: wrap; justify-content: center; border-radius: 22px; width: max-content; } } /* điện thoại: thanh dev xuống dòng, không tràn */
.bar .era .prog i { display: block; height: 100%; width: 0; border-radius: 3px; background: #e8c547; transition: width 0.4s; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
/* tin giữa các đảo và bảng dev "Cuộc đua" (ui/race-dev.js): bấm ô tin để mở bảng */
.news { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); width: min(360px, calc(100% - 32px)); border-radius: 14px; padding: 8px 12px; font-size: 12.5px; line-height: 1.45; color: var(--ink-dim); cursor: pointer; }
.race { z-index: 5; position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 74px); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); max-width: 560px; overflow-y: auto; overscroll-behavior: contain; border-radius: 16px; padding: 10px; font-size: 12.5px; line-height: 1.45; color: var(--ink-dim); }
.race .rb-head { display: flex; justify-content: space-between; align-items: center; padding: 2px 4px 8px; color: var(--ink); }
.race .rb-head button { border: 0; background: transparent; color: var(--ink); font-size: 16px; padding: 4px 8px; cursor: pointer; }
.race button.rb-card, .race .rb-log button { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid var(--c, var(--glass-line)); background: rgba(255, 255, 255, 0.05); color: inherit; font: inherit; border-radius: 10px; padding: 7px 10px; margin: 0 0 6px; cursor: pointer; }
.race .rb-card b, .race .rb-log b { color: var(--ink); }
.race .rb-card span { display: block; }
.race em { color: var(--amber); font-style: normal; }
.race .rb-stats { margin: 8px 4px; color: var(--ink); }
.race .rb-log button { border-left-width: 0; padding: 5px 8px; margin-bottom: 3px; }
#worldNews .top { color: #ffe08a; font-weight: 600; cursor: pointer; }
#worldNews .top u { margin-left: 6px; }
#worldNews .minor { opacity: 0.78; }
.resume { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); z-index: 30; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 14px; background: rgba(20, 40, 46, 0.86); color: #fff; font: 14px/1.3 Outfit, system-ui, sans-serif; }
.resume button { border: 0; border-radius: 10px; padding: 6px 12px; font: inherit; cursor: pointer; background: #ffd27a; color: #2a2a2a; }
.resume button[data-k=new] { background: rgba(255, 255, 255, 0.18); color: #fff; }
.race .rb-chron { margin: 8px 0; } .race .rb-chron p { margin: 4px 0; font-size: 0.85em; } .race .rb-chron i { display: block; margin-top: 6px; opacity: 0.75; }
.race .rb-chron button { display: block; width: 100%; text-align: left; border: 0; background: rgba(255, 215, 90, 0.07); color: inherit; font: inherit; border-radius: 8px; padding: 4px 8px; margin: 2px 0; cursor: pointer; }
.news b { color: var(--ink); font-weight: 600; }
#fps { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding: 5px 10px; border-radius: 10px; font-size: 12px; }
.err { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
@media (max-width: 720px) { .brand h1 { font-size: 28px; } .lands { top: calc(env(safe-area-inset-top, 0px) + 64px); } .bar { gap: 0; } .bar button { padding: 8px 7px; } .bar .sep { margin: 6px 1px; } .bar .era span { min-width: 0; font-size: 11.5px; } .news { font-size: 11px; padding: 6px 10px; bottom: calc(env(safe-area-inset-bottom, 0px) + 72px); } }
</style>

  <span class="sep"></span>
  <div class="era" role="group" aria-label="Năm của trận"><button id="yearPrev" title="Về năm trước (dev: dựng lại trận từ đầu, cùng seed)" aria-label="Năm trước">◀</button><button id="yearNext" title="Sang năm sau (dev: tua tới đầu năm sau)" aria-label="Năm sau">▶</button><span id="eraName" title="Thời kỳ đang có và phần đã đi tới thời sau">Thời đồ đá · 0%</span><span class="prog" id="eraProgBox" title="Tài nguyên đã gom cho thời sau"><i id="eraProg"></i></span></div>
  <span class="sep"></span>
  <button id="nextEvent" title="Dev: tua tới trận đánh kế tiếp (quân đánh tới cổng, nổi dậy, đảo chính, tên lửa) và bay tới đó">Trận đánh ⏭</button>
  <button id="nextDrama" title="Dev: tua tới drama kế tiếp (biểu tình, ẩu đả, đám tang, lễ hội…) và bay tới đó">Drama ⏭</button>

  <button id="sound" aria-pressed="false">Âm thanh</button>
</div>
<div class="glass news" id="worldNews" hidden aria-live="polite" role="button" tabindex="0" aria-expanded="false" title="Bấm để mở bảng Cuộc đua (dev)"></div>

<div class="glass" id="fps" hidden></div>
