   động ở dưới. Một giao diện tối có chủ ý (dưới đáy biển), cùng màu lam, tím, xà cừ của Thành Vỏ Ốc trong game. */
:root {
  --abyss: #04141b;
  --panel: rgba(8, 30, 40, 0.78);
  --line: rgba(127, 246, 255, 0.18);
  --ink: #e4f3f4;

  --seam: #7ff6ff;

  --danger: #ff7a6b;
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--abyss); color: var(--ink); font-family: var(--body); overflow: hidden; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.ui { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-columns: minmax(0, 250px) 1fr minmax(0, 320px);
  grid-template-rows: auto 1fr auto; gap: 12px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) calc(env(safe-area-inset-bottom, 0px) + 14px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ui > * { pointer-events: auto; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
header { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; pointer-events: none; }
header h1 { margin: 0; font: 700 26px/1.1 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
header .tag { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--violet); }
nav.list { grid-column: 1; grid-row: 2; align-self: start; padding: 10px; display: flex; flex-direction: column; gap: 10px; max-height: 100%; overflow: auto; }
nav.list .grp { display: flex; flex-direction: column; gap: 4px; }

nav.list button:hover { background: rgba(127, 246, 255, 0.08); }
nav.list button[aria-pressed="true"] { background: rgba(127, 246, 255, 0.16); color: #fff; }
nav.list button.monster[aria-pressed="true"] { background: rgba(255, 122, 107, 0.18); }
nav.list button:focus-visible, .modes button:focus-visible { outline: 2px solid var(--seam); outline-offset: 1px; }
aside.info { grid-column: 3; grid-row: 2; align-self: start; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; max-height: 100%; overflow: auto; min-width: 0; }
aside.info h3 { margin: 0; font: 700 22px/1.15 var(--display); }
aside.info .where { font-size: 12px; color: var(--violet); letter-spacing: 0.04em; }
aside.info .size { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
aside.info p, aside.info li { font-size: 13.5px; line-height: 1.5; color: var(--ink); margin: 0; }
aside.info h4 { margin: 6px 0 0; font: 600 11px var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--seam); }
aside.info ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.modes { grid-column: 1 / -1; grid-row: 3; justify-self: center; display: flex; gap: 4px; padding: 5px; }
.modes button { all: unset; cursor: pointer; padding: 8px 16px; border-radius: 9px; font-size: 14px; font-weight: 500; }
.modes button[aria-pressed="true"] { background: rgba(127, 246, 255, 0.18); }
.modes button[data-m="chase"][aria-pressed="true"] { background: rgba(255, 122, 107, 0.28); }
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 66px); font-size: 12px; color: var(--dim); pointer-events: none; text-align: center; }
@media (max-width: 760px) {
  .ui { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto auto; }

  nav.list .grp { flex-direction: row; align-items: center; }

  nav.list button { white-space: nowrap; }
  nav.list button small { display: none; }
  aside.info { grid-column: 1; grid-row: 4; max-height: 32vh; }
  .modes { grid-row: 5; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .hint::after { content: ' (máy bạn đặt giảm chuyển động: sinh vật vẫn động để xem thử)'; } }

/* =============== Cảnh =============== */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const scene = new T.Scene();
scene.background = new T.Color('#03121a');
scene.fog = new T.FogExp2('#03121a', 0.02);
const camera = new T.PerspectiveCamera(45, 1, 0.05, 900);
const controls = new T.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = PI * 0.53;
scene.add(new T.HemisphereLight('#5d93a8', '#04100d', 0.5));
const sun = new T.DirectionalLight('#a9dcf0', 0.75); sun.position.set(20, 60, 15); scene.add(sun);
const rim = new T.DirectionalLight('#6a4cff', 0.35); rim.position.set(-30, 10, -40); scene.add(rim); // (ánh tím viền lưng)
scene.add(new T.AmbientLight('#123542', 0.3));
// đáy cát nhấp nhô, đá rải, cột sáng từ trên rọi xuống
{
  const g = new T.PlaneGeometry(600, 600, 90, 90); g.rotateX(-PI / 2);
  const P = g.attributes.position;
  for (let i = 0; i < P.count; i++) { const x = P.getX(i), z = P.getZ(i), d = Math.hypot(x, z); P.setY(i, (S(x * 0.08) * C(z * 0.07) * 0.6 + S(x * 0.31 + z * 0.2) * 0.15) * Math.min(1, d / 20) + Math.max(0, d - 120) * 0.15); }
  g.computeVertexNormals();
  scene.add(new T.Mesh(g, flat('#22373a')));
  for (let i = 0; i < 70; i++) { const a = Math.random() * PI * 2, d = 18 + Math.random() * 160, s = 0.6 + Math.random() * 4; add(scene, GEO.rock, flat(i % 3 ? '#2c3a3e' : '#38463f'), C(a) * d, s * 0.3, S(a) * d, s, s * 0.7, s, Math.random(), Math.random(), 0); }
  for (let i = 0; i < 40; i++) { const a = Math.random() * PI * 2, d = 6 + Math.random() * 60; add(scene, GEO.cone, flat(i % 2 ? '#2f6e44' : '#3f8a52'), C(a) * d, 0, S(a) * d, 0.15, 1.5 + Math.random() * 3, 0.15); }
}
const bubbleGeo = new T.BufferGeometry(), NB = 500, bp = new Float32Array(NB * 3);
for (let i = 0; i < NB; i++) { bp[i * 3] = (Math.random() - 0.5) * 140; bp[i * 3 + 1] = Math.random() * 60; bp[i * 3 + 2] = (Math.random() - 0.5) * 140; }
bubbleGeo.setAttribute('position', new T.BufferAttribute(bp, 3));

// người trên đảo (cao 1,4) để so cỡ

// dựng mọi sinh vật
const C8 = DEFS.map((d) => Object.assign({ def: d }, d.make()));
C8.forEach((c) => { scene.add(c.root); c.root.visible = false; });
const ref = BE.villager(); scene.add(ref); ref.visible = false;

/* =============== Giao diện =============== */
const list = document.getElementById('list'), info = document.getElementById('info');
const VIEWS = [];
RUINS.forEach((ruin, ri) => {
  const grp = document.createElement('div'); grp.className = 'grp';
  grp.innerHTML = '<h2>' + ruin + '</h2>';
  DEFS.forEach((d, i) => { if (d.ruin !== ri) return; const b = document.createElement('button'); b.className = d.monster ? 'monster' : ''; b.dataset.v = 'c' + i; b.innerHTML = '<span>' + d.name + '</span><small>' + (d.monster ? 'quái vật' : d.count ? '× ' + d.count : 'phương án') + '</small>'; grp.appendChild(b); VIEWS.push(b); });
  list.appendChild(grp);
});
{
  const grp = document.createElement('div'); grp.className = 'grp'; grp.innerHTML = '<h2>So cỡ</h2>';
  for (const [v, n] of [['npcs', 'Năm NPC biến dị'], ['monsters', 'Ba quái vật']]) { const b = document.createElement('button'); b.dataset.v = v; b.innerHTML = '<span>' + n + '</span><small>cả nhóm</small>'; grp.appendChild(b); VIEWS.push(b); }
  list.appendChild(grp);
}
let view = 'c0', mode = 'idle';
function infoFor(v) {
  if (v === 'npcs') return '<h3>Năm NPC biến dị</h3><div class="size">Người xám ở đầu hàng: người trên đảo, cao 1,4</div><p>Thành Vỏ Ốc Xà Cừ: 10 Người Ốc, 2 Người Rêu Đá. Vườn Treo Bậc Thang: 10 Người Vây, 1 Người Rêu Đá. Đô Thị Đá Khổng Lồ: 6 Người Rêu Đá, 9 Người San Hô. Ba đường hầm: mỗi hầm 4 Người Canh Hầm. Khung người, mặt, cách đi dựng riêng, không dùng chung với người trên đảo.</p>';
  if (v === 'monsters') return '<h3>Ba quái vật biển</h3><div class="size">Chấm nhỏ dưới Cá Mập Xương: một Người Ốc</div><p>Mỗi phế tích có hai trong ba loài. Thành Vỏ Ốc Xà Cừ: bầy 4 Rồng Lươn Đen, 1 Bạch Tuộc. Vườn Treo Bậc Thang: bầy 4 Rồng Lươn Đen, đàn 3 Cá Mập Xương. Đô Thị Đá Khổng Lồ: đàn 3 Cá Mập Xương, 1 Bạch Tuộc.</p>';
  const d = DEFS[+v.slice(1)];
  return '<h3>' + d.name + '</h3><div class="where">' + RUINS[d.ruin] + (d.monster || !d.count ? '' : ' · ' + d.count + ' người') + '</div><div class="size">' + d.size + '</div>'
    + '<h4>Tạo hình</h4><ul>' + d.look.map((x) => '<li>' + x + '</li>').join('') + '</ul><h4>Chuyển động</h4><ul>' + d.move.map((x) => '<li>' + x + '</li>').join('') + '</ul>';
}
function setView(v) {
  view = v;
  VIEWS.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  info.innerHTML = infoFor(v);
  C8.forEach((c) => { c.root.visible = false; c.theta = 0; });
  ref.visible = false;
  scene.fog.density = v === 'monsters' ? 0.004 : v[0] === 'c' && C8[+v.slice(1)].monster ? 0.009 : 0.02;
  if (v === 'npcs') {
    ref.visible = true; ref.position.set(-2.4, 0, 0); ref.rotation.y = 0;
    [0, 1, 2, 3, 4].forEach((i, k) => { const c = C8[i]; c.root.visible = true; c.root.position.set(-0.6 + k * 1.6 + (i === 4 ? 1.8 : 0), i === 1 ? 0 : 0, 0); c.root.rotation.y = 0; });
    controls.target.set(3, 2.6, 0); camera.position.set(3, 4.2, 17);
  } else if (v === 'monsters') {
    // lươn nằm phía sau, đầu quay sang trái, thân kéo dài 72 sang phải; cua giữa, bạch tuộc bên phải
    // bầy lươn bên trái (đầu quay sang trái), cá mập xương giữa, bạch tuộc (cao 95) bên phải
    const pos = { 5: [-70, 14, -10, -PI / 2], 6: [-6, 10, 10, PI / 2 + 0.3], 7: [70, 0, -20, 0] };
    for (const i of [5, 6, 7]) { const c = C8[i], q = pos[i]; c.root.visible = true; c.root.position.set(q[0], q[1], q[2]); c.root.rotation.y = q[3]; }
    C8[0].root.visible = true; C8[0].root.position.set(-6, 0, 34); C8[0].root.rotation.y = 0;
    controls.target.set(0, 26, -10); camera.position.set(0, 48, 175);
  } else {
    const c = C8[+v.slice(1)]; c.root.visible = true; c.root.position.set(0, c.swimY || 0, 0); c.root.rotation.y = c.sideways ? -PI / 2 : 0;
    const s = c.size, F = c.frame;
    if (F) { controls.target.set(...F[0]); camera.position.set(...F[1]); }
    else { controls.target.set(0, s * 0.5, 0); camera.position.set(s * 0.9, s * 0.55, s * 1.5); }
  }
  controls.update();
}
list.addEventListener('click', (e) => { const b = e.target.closest('button[data-v]'); if (b) setView(b.dataset.v); });
document.querySelector('.modes').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-m]'); if (!b) return;
  mode = b.dataset.m;
  document.querySelectorAll('.modes button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  if (mode === 'idle' || mode === 'curl') setView(view);
});
setView(location.hash === '#monsters' ? 'monsters' : location.hash === '#npcs' ? 'npcs' : 'c0');

/* =============== Mỗi khung hình =============== */
// đi, đuổi: sinh vật chạy trên vòng tròn quanh giữa cảnh; khi đuổi, máy quay chạy trước nó và quay nhìn lại, khoảng cách co
// giãn theo nhịp (sinh vật vọt tới gần rồi tụt lại): cảm giác bị đuổi
const clock = new T.Clock();
let last = 0;
function frame() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  const single = view[0] === 'c' ? C8[+view.slice(1)] : null;
  // kiểu chuyển động mà sinh vật này có: Người Ốc biết bơi riêng; Người Rêu Đá, Người San Hô nằm co ngụy trang
  const SUP = { snail: ['swim'], keeper: ['swim'], coral: ['curl'], moss: ['curl'], stonefish: ['curl'], moray: ['curl'], ray: ['curl'] };
  const eff = (c) => (mode === 'swim' || mode === 'curl') && !(SUP[c.def.key] || []).includes(mode) ? (mode === 'swim' ? 'move' : 'idle') : mode;
  const m1 = single ? eff(single) : 'idle';
  if (single && m1 !== 'idle' && m1 !== 'curl') {
    const c = single, s = c.size, R = c.monster ? Math.max(60, s * 1.2) : Math.max(8, s * 3.2), y = c.swimY || 0;
    const base = (m1 === 'chase' ? (c.monster ? 14 : s * 3.2) : c.monster ? 6 : s * 0.9) / R;
    c.theta = (c.theta || 0) + base * dt;
    let th = c.theta, spd = base * R;
    if (m1 === 'chase') {
      const gapD = (c.monster ? s * 0.5 : s * 2.4) * (1 - 0.62 * pulse(t, c.monster ? 2.6 : 1.8, 3)), camTh = th, ct = camTh - gapD / R;
      spd = (ct - (c.prevTh ?? ct)) / dt * R; c.prevTh = ct; th = ct;
      const camH = c.monster ? s * 0.18 : s * 0.45;
      camera.position.set(C(camTh + 0.02) * R, y + camH, S(camTh + 0.02) * R);
      controls.target.set(C(th) * R, y + (c.monster ? s * 0.05 : s * 0.5), S(th) * R);
      camera.lookAt(controls.target);
    } else { c.prevTh = undefined; controls.target.lerp(new T.Vector3(C(th) * R, y + (c.monster ? s * 0.1 : s * 0.5), S(th) * R), 1 - Math.exp(-dt * 3)); }
    c.root.position.set(C(th) * R, y, S(th) * R);
    c.root.rotation.y = -th; // (Cua: thân ngang hướng đi, đi ngang)
    c.update(t, dt, m1, Math.max(0, spd) / Math.max(1, s * 0.6), 1 / R, camera.position);
  } else C8.forEach((c) => c.root.visible && c.update(t, dt, view[0] === 'c' ? eff(c) : 'idle', 0, 0, camera.position));
  for (let i = 0; i < NB; i++) { bp[i * 3 + 1] += dt * (0.6 + (i % 7) * 0.12); if (bp[i * 3 + 1] > 60) bp[i * 3 + 1] = 0; }
  bubbleGeo.attributes.position.needsUpdate = true;
  if (!(single && m1 === 'chase')) controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function resize() { const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize); resize();
window.__creatures = { setView, camera, controls, setMode: (m) => document.querySelector('.modes button[data-m="' + m + '"]').click() };
requestAnimationFrame(frame);
</script>
