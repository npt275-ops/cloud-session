<style>
/* Bể Kính, bản làm lại từ đầu: sáu đảo thô chỉ có thiên nhiên, thời tiết và phòng mẫu công trình theo mười hai thời đại.
   Cả màn hình là thế giới 3D, chữ và nút là lớp kính mỏng ở mép. */
:root {
  --ink: #f5f1e8; --title: #fffaf0; --title-dim: rgba(255, 250, 240, 0.8); --ink-dim: rgba(245, 241, 232, 0.72); --glass: rgba(14, 22, 38, 0.42); --glass-line: rgba(255, 255, 255, 0.16);
  --amber: #ffd27a; --bg: #0b1430;
  --font-display: "Fraunces", Georgia, "Times New Roman", serif;
  --font-body: "Outfit", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
body.day { --title: #13233a; --title-dim: rgba(19, 35, 58, 0.78); --glass: rgba(14, 22, 38, 0.6); }
.brand, .clock { color: var(--title); transition: color 1.2s; pointer-events: none; text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35); }
body.day .brand, body.day .clock { text-shadow: 0 1px 12px rgba(255, 255, 255, 0.55); }
.brand { position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); top: calc(env(safe-area-inset-top, 0px) + 18px); }
.brand h1 { margin: 0; font: 700 clamp(30px, 4.4vw, 54px)/0.95 var(--font-display); letter-spacing: -0.01em; }
.clock { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); top: calc(env(safe-area-inset-top, 0px) + 20px); text-align: right; }
.clock b { display: block; font: 500 clamp(26px, 3vw, 38px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.clock span { font-size: 13px; color: var(--title-dim); letter-spacing: 0.06em; text-transform: uppercase; }
.lands { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 16px); transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 999px; max-width: calc(100% - 24px); overflow-x: auto; scrollbar-width: none; }
.lands button { border: 0; background: transparent; color: var(--ink); font: 600 13px var(--font-body); padding: 6px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; display: flex; gap: 7px; align-items: center; text-align: left; }
.lands button small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-dim); }
.lands button i { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
.lands button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.16); }
.bar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; max-width: calc(100% - 24px); }
.bar button { border: 0; background: transparent; color: var(--ink); font: 500 13px var(--font-body); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
.bar button:hover { background: rgba(255, 255, 255, 0.08); }
.bar button[aria-pressed="true"] { background: rgba(255, 255, 255, 0.16); }
.bar .sep { width: 1px; align-self: stretch; margin: 6px 2px; background: var(--glass-line); }
.bar .era { display: flex; align-items: center; gap: 2px; }
.bar .era span { min-width: 9.5em; text-align: center; font-size: 13px; }
.bar .era button { padding: 8px 10px; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.note { position: fixed; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); width: min(330px, calc(100% - 40px)); border-radius: 16px; padding: 12px 14px; font-size: 13.5px; color: var(--ink-dim); }
.note b { color: var(--ink); }
#fps { position: fixed; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); padding: 5px 10px; border-radius: 10px; font-size: 12px; }
.pad { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); display: grid; grid-template-columns: repeat(3, 46px); gap: 6px; }
.pad button { width: 46px; height: 46px; border: 1px solid var(--glass-line); border-radius: 14px; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font-size: 18px; touch-action: none; }
.pad button.on { background: rgba(255, 255, 255, 0.22); }
.err { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; }
@media (max-width: 720px) { .brand h1 { font-size: 28px; } .lands { top: calc(env(safe-area-inset-top, 0px) + 64px); } .bar button { padding: 8px 10px; } .bar .era span { min-width: 7em; } .note { display: none; } }
</style>

<script>
(function () {
  'use strict';
  if (!window.THREE || !THREE.OrbitControls || !window.Lands3D || !window.Sea3D) {
    document.body.insertAdjacentHTML('beforeend', '<div class="err">Không tải được thư viện 3D. Hãy tải lại trang.</div>');
    return;
  }
  const $ = (id) => document.getElementById(id);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const C = (h) => new THREE.Color(h);
  const audio = window.CityAudio ? CityAudio.create() : null;

  /* =============== Thế giới: chỉ có thời gian và sáu vùng đất =============== */
  // Chưa có người, chưa có kinh tế. Logic mới (48 nhân vật cốt lõi, gen, hội đồng, chiến tranh qua cầu) sẽ thay vào đây.
  const TERRAINS = [
    { key: 'plains', land: 'Đồng bằng', city: 'Lúa Vàng' }, { key: 'forest', land: 'Rừng', city: 'Thông Xanh' }, { key: 'mountain', land: 'Núi', city: 'Đá Mây' },
    { key: 'tundra', land: 'Băng nguyên', city: 'Tuyết Trắng' }, { key: 'coast', land: 'Biển', city: 'Cửa Sóng' }, { key: 'desert', land: 'Sa mạc', city: 'Cát Hồng' },
  ];
  const W = {
    day: 0,
    // các lớp dựng hình cũ đọc trạng thái mỗi đảo từ đây; w: null nghĩa là chưa có người
    cities: TERRAINS.map((terrain, i) => ({ id: i, terrain, settled: true, era: 0, w: null, dmg: [] })),
    bridges: [0, 1, 2, 3, 4, 5].map((a) => ({ a, b: (a + 1) % 6, era: 0 })), // sáu cây cầu thô nối vòng sáu đảo
    trade: [],
  };
  const Sim = { TERRAINS };
  let focus = 0;

  /* =============== Renderer, camera =============== */
  const canvas = $('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 4200);
  const OVERVIEW = 525;
  camera.position.set(0, 318, 414);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.target.set(0, 0, 0);
  controls.enableDamping = true; controls.dampingFactor = 0.07;
  controls.minDistance = 14; controls.maxDistance = 820; controls.maxPolarAngle = Math.PI * 0.49;
  controls.autoRotate = false; // camera chỉ đi theo tay người chơi
  controls.enablePan = true; controls.screenSpacePanning = true;
  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w < 720 ? 50 : 34;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();
  if (window.innerWidth < 720) camera.position.multiplyScalar(1.5);

  /* =============== Bầu trời, ánh sáng =============== */
  const skyMat = new THREE.ShaderMaterial({
    uniforms: { top: { value: C('#5aa9e6') }, bottom: { value: C('#cfe8f5') }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: C('#fff3d0') } },
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position,1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: 'uniform vec3 top; uniform vec3 bottom; uniform vec3 sunDir; uniform vec3 sunCol; varying vec3 vW; void main(){ vec3 d = normalize(vW); float h = clamp(d.y * 1.4 + 0.25, 0.0, 1.0); vec3 c = mix(bottom, top, pow(h, 0.8)); float s = max(dot(d, normalize(sunDir)), 0.0); c += sunCol * (pow(s, 600.0) * 1.2 + pow(s, 12.0) * 0.18); gl_FragColor = vec4(c, 1.0); }',
    side: THREE.BackSide, depthWrite: false,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(1900, 32, 16), skyMat));
  scene.fog = new THREE.Fog(0xcfe8f5, 600, 2400);
  const starPos = [];
  for (let i = 0; i < 700; i++) { const u = hash(i), t = hash(i + 7) * Math.PI * 2, r = 1750, y = u; starPos.push(Math.cos(t) * Math.sqrt(1 - y * y) * r, y * r, Math.sin(t) * Math.sqrt(1 - y * y) * r); }
  const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, fog: false, depthWrite: false });
  scene.add(new THREE.Points(starGeo, starMat));
  const hemi = new THREE.HemisphereLight(0xdff1ff, 0x5d6b4a, 0.55);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 420 });
  sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
  scene.add(sun); scene.add(sun.target);
  const moon = new THREE.DirectionalLight(0xb4c3ff, 0.0);
  scene.add(moon);

  /* =============== Vật liệu, khói =============== */
  const mats = new Map();
  function mat(hex, o) {
    const k = hex + JSON.stringify(o || {});
    if (!mats.has(k)) mats.set(k, new THREE.MeshStandardMaterial(Object.assign({ color: hex, flatShading: true, roughness: 0.88, metalness: 0.02 }, o || {})));
    return mats.get(k);
  }
  function mesh(geo, m, x, y, z, parent) { const me = new THREE.Mesh(geo, m); me.position.set(x || 0, y || 0, z || 0); me.castShadow = true; me.receiveShadow = true; if (parent) parent.add(me); return me; }
  const glowTex = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.25, 'rgba(255,255,255,0.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();
  const moonDisc = new THREE.Mesh(new THREE.CircleGeometry(34, 40), new THREE.MeshBasicMaterial({ color: '#f2f5ff', transparent: true, opacity: 0, fog: false, depthWrite: false }));
  const moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#c9d6ff', transparent: true, opacity: 0, fog: false, depthWrite: false, blending: THREE.AdditiveBlending }));
  moonHalo.scale.setScalar(260); moonDisc.renderOrder = -1; moonHalo.renderOrder = -1; moonDisc.userData.noFade = moonHalo.userData.noFade = true;
  scene.add(moonDisc, moonHalo);

  const puffGeo = new THREE.IcosahedronGeometry(0.35, 0), puffs = [];
  for (let i = 0; i < 60; i++) { const m = new THREE.Mesh(puffGeo, new THREE.MeshStandardMaterial({ color: '#f2f2f2', transparent: true, opacity: 0, flatShading: true, roughness: 1, depthWrite: false })); m.visible = false; scene.add(m); puffs.push({ m, t0: 0 }); }
  let puffIdx = 0;
  function puff(worldPos, dark, color) { const p = puffs[puffIdx++ % puffs.length]; p.m.position.copy(worldPos); p.m.material.color.set(color || (dark ? '#8d8d8d' : '#f4f4f4')); p.t0 = performance.now(); p.m.visible = true; }
  function updatePuffs(now, dt) { for (const p of puffs) { if (!p.m.visible) continue; const k = (now - p.t0) / 3200; if (k > 1) { p.m.visible = false; continue; } p.m.position.y += dt * 0.0012; p.m.position.x += dt * 0.0004; p.m.scale.setScalar(0.6 + k * 1.8); p.m.material.opacity = 0.55 * (1 - k); } }
  const clickable = () => {}, unclickable = () => {};

  /* =============== Bể kính bao quanh sáu miền =============== */
  const DOME = Lands3D.RING + Lands3D.LAND_R + 16;
  const dome = new THREE.Mesh(new THREE.SphereGeometry(DOME, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshPhongMaterial({ color: 0xe8f6ff, transparent: true, opacity: 0.06, shininess: 160, specular: 0xffffff, side: THREE.DoubleSide, depthWrite: false }));
  dome.raycast = () => {}; dome.renderOrder = 4;
  scene.add(dome);
  const ring = mesh(new THREE.TorusGeometry(DOME, 0.9, 8, 180), mat('#b08d57', { metalness: 0.6, roughness: 0.35 }), 0, 0, 0, scene);
  ring.rotation.x = Math.PI / 2;
  for (let i = 0; i < 18; i++) { const a = (i / 18) * Math.PI * 2; mesh(new THREE.SphereGeometry(1.4, 8, 6), mat('#c9a66b', { metalness: 0.6, roughness: 0.3 }), Math.cos(a) * DOME, 0, Math.sin(a) * DOME, scene); }
  // đá trôi lơ lửng bên ngoài bể và mây
  const floaters = [];
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2 + hash(i), r = DOME + 16 + hash(i + 2) * 70, s = 3 + hash(i + 4) * 7;
    const rock = mesh(new THREE.DodecahedronGeometry(s, 0), mat('#7b6a58'), Math.cos(a) * r, -18 - hash(i + 6) * 50, Math.sin(a) * r, scene);
    mesh(new THREE.CylinderGeometry(s * 0.9, s * 0.7, 0.8, 7), mat('#86b86a'), 0, s * 0.75, 0, rock);
    floaters.push({ m: rock, y: rock.position.y, ph: hash(i) * 6 });
  }

  /* =============== Sáu vùng đất, biển, mây =============== */
  const lands3d = Lands3D.create({ THREE, scene, Sim, W, hash, C, clamp, lerp, reduce, glowTex, puff, clickable, unclickable, noPeople: true });
  const lands = lands3d.lands;
  const sea3d = Sea3D.create({ THREE, scene, lands3d, C, clamp, reduce });
  let lightFlash = 0, stormK = 0;
  const clouds3d = Clouds3D.create({ THREE, scene, lands3d, dome: DOME, reduce, glowTex, audio, flash: (k) => { lightFlash = Math.max(lightFlash, k); }, dayOfYear: () => ((W.day % 360) + 360) % 360, speed: () => tps / 0.75 });

  /* =============== Tuyết mùa đông trên băng nguyên và núi =============== */
  const SNOW_N = 900, snowSets = ['tundra', 'mountain'].map((ter) => {
    const L = lands.find((l) => l.ter === ter), pos = new Float32Array(SNOW_N * 3);
    for (let i = 0; i < SNOW_N; i++) { const a = hash(i * 5 + L.i) * Math.PI * 2, r = Math.sqrt(hash(i * 5 + 1 + L.i)) * (Lands3D.LAND_R + 4); pos[i * 3] = Math.cos(a) * r; pos[i * 3 + 1] = hash(i * 5 + 2) * 48; pos[i * 3 + 2] = Math.sin(a) * r; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const m = new THREE.Points(g, new THREE.PointsMaterial({ color: '#ffffff', size: 0.9, map: glowTex, transparent: true, opacity: 0, depthWrite: false }));
    m.position.copy(L.center); m.frustumCulled = false; m.visible = false; scene.add(m);
    return { L, m, pos, k: 0, heavy: ter === 'tundra' ? 1 : 0.6 };
  });
  function updateSnow(dt, t, winter) {
    const sdt = dt / 1000;
    for (const S of snowSets) {
      S.k += (winter * S.heavy - S.k) * Math.min(1, dt / 3000);
      S.m.visible = S.k > 0.02; if (!S.m.visible) continue;
      S.m.material.opacity = 0.9 * S.k;
      for (let i = 0; i < SNOW_N; i++) { const o = i * 3; S.pos[o + 1] -= (reduce ? 1 : 2.6) * sdt * (0.7 + hash(i) * 0.6); S.pos[o] += Math.sin(t * 0.0008 + i) * 0.4 * sdt; if (S.pos[o + 1] < 0) S.pos[o + 1] += 48; }
      S.m.geometry.attributes.position.needsUpdate = true;
    }
  }

  /* =============== Mùa: màu đất và cây đổi dần theo bốn mùa =============== */
  const SEASONS = ['Mùa xuân', 'Mùa hạ', 'Mùa thu', 'Mùa đông'];
  let seasonKey = '';
  function seasonWeights() {
    const d = ((W.day % 360) + 360) % 360, s = Math.floor(d / 90), into = d - s * 90, w = [0, 0, 0, 0], blend = 15;
    // ngày đầu tiên của bể là mùa xuân, không trộn với mùa đông trước đó
    if (into < blend && W.day >= 90) { const k = into / blend; w[s] = k; w[(s + 3) % 4] = 1 - k; } else w[s] = 1;
    return { w, s };
  }
  function updateSeasons(force) {
    const { w } = seasonWeights(), key = w.map((x) => x.toFixed(2)).join();
    if (force || key !== seasonKey) { seasonKey = key; lands3d.seasons(w, 0); }
  }

  /* =============== Công trình có sẵn trên Lúa Vàng (render/buildings3d.js), làm bản chính để bắt đầu build =============== */
  const K3 = lands3d.kit;
  const buildings = BK.Buildings3D.create({ THREE, W, Sim, lands3d, hash, puff, reduce });
  buildings.show(0, 0); // đảo Lúa Vàng, thời nguyên thuỷ

  /* =============== NPC mẫu: một người duy nhất, huấn luyện cả thư viện cử chỉ (render/gestures3d.js) =============== */
  // Logic làng (logic/) vẫn tạo đủ tám người lập làng để lấy gen; chỉ vẽ một người: người lập làng ngồi ghế vua.
  // Làng nhiều người (render/village3d.js, ui/village-ui.js) để đó, bật lại khi áp cử chỉ cho mọi NPC.
  const isle = BK.Island.create({ key: 'plains', seed: 42 });
  const modelPerson = isle.people.get(isle.seats.king);
  const model = BK.Model3D.create({ THREE, scene, L: lands[0], person: modelPerson, clearTrees: K3.clearTrees });
  const modelUi = BK.ModelUI.create({ model });
  const lookAtModel = () => { const sp = model.worldPos(); flyTo(sp, 13, lands[0].inw.clone().setY(0.35), 1.8); };
  $('toModel').onclick = lookAtModel;
  // mở game là nhìn vào sân diễn trước nhà chính (cuộn ra để thấy cả bể)
  { const sp = model.worldPos(); controls.target.copy(sp).setY(1.8); camera.position.copy(sp).addScaledVector(lands[0].inw, 11).add(new THREE.Vector3(3, 5, 0)); if (window.innerWidth < 720) camera.position.sub(controls.target).multiplyScalar(1.5).add(controls.target); }
  // bấm vào NPC (chạm nhẹ, không kéo) để mở thẻ nhỏ; bấm chỗ khác để đóng
  { const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
    canvas.addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
    canvas.addEventListener('pointerup', (e) => {
      if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
      ndc.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
      if (model.hit(ray)) modelUi.open(e.clientX, e.clientY); else modelUi.close();
    }); }

  /* =============== Thanh sáu vùng đất =============== */
  const TER_DOT = { plains: '#86bb63', forest: '#3f7a4c', mountain: '#a39d90', tundra: '#e4edf2', coast: '#4aa3c7', desert: '#e3c58e' };
  let focusTween = null;
  function flyTo(p, dist, dir, y) { const k = camera.aspect < 0.8 ? 1.4 : 1; focusTween = { target: p.clone().setY(y == null ? 2 : y), t0: performance.now(), from: controls.target.clone(), dist: camera.position.distanceTo(controls.target), toDist: (dist || 30) * k, dirFrom: dir ? camera.position.clone().sub(controls.target).normalize() : null, dirTo: dir ? dir.clone().normalize() : null, dur: dir ? 1700 : 1200 }; }
  function setFocus(i) { focus = i; for (const b of $('landBar').children) b.setAttribute('aria-pressed', String(+b.dataset.i === i)); }
  $('landBar').innerHTML = TERRAINS.map((T, i) => '<button data-i="' + i + '" aria-pressed="' + (i === 0) + '"><i style="background:' + TER_DOT[T.key] + '"></i><span>' + T.city + '<small>' + T.land + '</small></span></button>').join('');
  $('landBar').addEventListener('click', (e) => { const b = e.target.closest('button[data-i]'); if (!b) return; setFocus(+b.dataset.i); flyTo(lands[focus].center, 96); });

  /* =============== Bay tự do: phím mũi tên, W A S D, Q E =============== */
  const stopOrbit = () => {}, story = null, toggleMore = () => {};
  const FLY = { keys: new Set(), pad: new Set(), v: new THREE.Vector3(), on: false, padOn: false, near: 0 };
  const FLY_KEYS = { ArrowUp: 'fwd', KeyW: 'fwd', ArrowDown: 'back', KeyS: 'back', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', PageUp: 'up', KeyE: 'up', Space: 'up', PageDown: 'down', KeyQ: 'down', ShiftLeft: 'down', ShiftRight: 'down' };
  const typing = (t) => !!t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  const touchUi = () => window.matchMedia('(pointer: coarse)').matches || window.innerWidth < 760;
  document.addEventListener('keydown', (e) => {
    const k = FLY_KEYS[e.code];
    if (!k || e.ctrlKey || e.metaKey || e.altKey || typing(e.target) || document.body.classList.contains('intro')) return;
    if (e.code === 'Space' && e.target && e.target.closest && e.target.closest('button, a, [role="tab"]')) return; // Space trên nút là bấm nút
    if (e.target && e.target.closest && e.target.closest('[role="tablist"]') && /^Arrow/.test(e.code)) return;
    e.preventDefault(); FLY.keys.add(k);
  });
  document.addEventListener('keyup', (e) => { const k = FLY_KEYS[e.code]; if (k) FLY.keys.delete(k); });
  window.addEventListener('blur', () => { FLY.keys.clear(); FLY.pad.clear(); });
  for (const b of document.querySelectorAll('#flyPad button')) {
    const k = b.dataset.k, on = (v) => (e) => { e.preventDefault(); if (v) FLY.pad.add(k); else FLY.pad.delete(k); b.classList.toggle('on', v); };
    b.addEventListener('pointerdown', on(true)); for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) b.addEventListener(ev, on(false));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  function flyPadUi(on) { FLY.padOn = on; $('flyPad').hidden = !on; $('flyBtn').setAttribute('aria-pressed', String(on)); }
  $('flyBtn').onclick = () => { flyPadUi(!FLY.padOn); toggleMore(false); };
  flyPadUi(touchUi());
  const _ff = new THREE.Vector3(), _frt = new THREE.Vector3(), _fm = new THREE.Vector3(), _fo = new THREE.Vector3();
  function flyStep(dt) {
    const has = (k) => FLY.keys.has(k) || FLY.pad.has(k);
    _fm.set((has('right') ? 1 : 0) - (has('left') ? 1 : 0), (has('up') ? 1 : 0) - (has('down') ? 1 : 0), (has('fwd') ? 1 : 0) - (has('back') ? 1 : 0));
    FLY.v.lerp(_fm, Math.min(1, dt / (_fm.lengthSq() ? 180 : 260))); // tăng tốc êm, hãm dần
    if (FLY.v.lengthSq() < 4e-6) { FLY.v.set(0, 0, 0); FLY.on = false; return false; }
    if (!FLY.on) { FLY.on = true; focusTween = null; stopOrbit(); if (story) story.userMoved(); }
    const off = _fo.copy(camera.position).sub(controls.target), dist = off.length();
    const sp = clamp(dist * 0.85, 10, 230) * dt / 1000;
    _ff.copy(off).setY(0); if (_ff.lengthSq() < 1e-6) _ff.set(0, 0, -1); else _ff.normalize().negate();
    _frt.set(-_ff.z, 0, _ff.x);
    const mx = _ff.x * FLY.v.z * sp + _frt.x * FLY.v.x * sp, mz = _ff.z * FLY.v.z * sp + _frt.z * FLY.v.x * sp;
    controls.target.x += mx; controls.target.z += mz; camera.position.x += mx; camera.position.z += mz;
    if (Math.abs(FLY.v.y) > 1e-3) { const nd = clamp(dist * (1 + FLY.v.y * 1.1 * dt / 1000), controls.minDistance, controls.maxDistance); off.setLength(nd); camera.position.copy(controls.target).add(off); }
    const r = Math.hypot(controls.target.x, controls.target.z), lim = DOME - 14;
    if (r > lim) { const k = lim / r - 1, dx = controls.target.x * k, dz = controls.target.z * k; controls.target.x += dx; controls.target.z += dz; camera.position.x += dx; camera.position.z += dz; }
    // bay tới trên đảo nào thì đảo đó thành đảo đang xem
    const t = performance.now();
    if (t > FLY.near) {
      FLY.near = t + 400; let best = -1, bd = 1e9;
      for (const L of lands3d.lands) { const d = Math.hypot(controls.target.x - L.center.x, controls.target.z - L.center.z); if (d < bd) { bd = d; best = L.i; } }
      if (best >= 0 && bd < Lands3D.LAND_R && best !== focus) setFocus(best);
    }
    return true;
  }

  /* =============== Ngày đêm =============== */
  let tod = 0.3;
  const DAY_MS = 90000;
  const SKY = { nightTop: C('#0b1430'), nightBot: C('#1c2550'), dawnTop: C('#4a6aa8'), dawnBot: C('#f4a96c'), dayTop: C('#4c9fe0'), dayBot: C('#d4ecf7') };
  const sunDir = new THREE.Vector3(), _moonP = new THREE.Vector3();
  function applyTime() {
    const ang = (tod - 0.25) * Math.PI * 2, e = Math.sin(ang);
    const day = clamp(e * 2.2 + 0.25, 0, 1), night = 1 - clamp(e * 3 + 0.6, 0, 1), gold = clamp(1 - Math.abs(e) * 3.2, 0, 1) * (e > -0.25 ? 1 : 0);
    sunDir.set(Math.cos(ang) * 0.85, Math.max(0.05, e), 0.55).normalize();
    // bóng đổ theo vùng camera đang nhìn, để sáu miền rộng vẫn có bóng sắc nét ở chỗ gần
    sun.target.position.copy(controls.target).setY(0);
    sun.position.copy(sun.target.position).addScaledVector(sunDir, 200);
    sun.intensity = 1.0 * day;
    document.body.classList.toggle('day', day > 0.55);
    sun.color.copy(C('#fff1d6')).lerp(C('#ffb36b'), gold * 0.8);
    moon.position.set(-sunDir.x * 100, 80, -sunDir.z * 100); moon.intensity = 0.52 * night; // trăng sáng hơn: đêm không tối mịt
    hemi.intensity = 0.22 + 0.3 * day + 0.24 * night;
    hemi.color.copy(C('#dff1ff')).lerp(C('#8196d6'), night);
    { const mp = _moonP.set(-sunDir.x, 0.62, -sunDir.z).normalize().multiplyScalar(1500); moonDisc.position.copy(mp); moonDisc.lookAt(camera.position); moonHalo.position.copy(mp); moonDisc.material.opacity = 0.95 * night; moonHalo.material.opacity = 0.55 * night; moonDisc.visible = moonHalo.visible = night > 0.02; }
    const top = SKY.nightTop.clone().lerp(SKY.dayTop, day).lerp(SKY.dawnTop, gold * 0.6);
    const bot = SKY.nightBot.clone().lerp(SKY.dayBot, day).lerp(SKY.dawnBot, gold * 0.75);
    const overcast = stormK * 0.55 * 0.6; // giông trong bể làm trời sầm lại
    if (overcast > 0.001) { top.lerp(C('#7f8c99').lerp(C('#1d2531'), night), overcast * 0.7); bot.lerp(C('#bac4cb').lerp(C('#252e3b'), night), overcast * 0.7); sun.intensity *= 1 - 0.6 * overcast; }
    if (lightFlash > 0.001) { hemi.intensity += lightFlash * 1.3; } // chớp loé sáng cả bể
    skyMat.uniforms.top.value.copy(top); skyMat.uniforms.bottom.value.copy(bot);
    skyMat.uniforms.sunDir.value.copy(sunDir); skyMat.uniforms.sunCol.value.copy(sun.color).multiplyScalar(day);
    scene.fog.color.copy(bot);
    starMat.opacity = night * 0.9;
    const hours = tod * 24, hh = Math.floor(hours), mm = Math.floor((hours - hh) * 60 / 10) * 10;
    $('time').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    return { day, night };
  }

  /* =============== Mượt và nét: độ phân giải động nhắm 60 khung hình mỗi giây =============== */
  let fpsOn = false;
  const lowEnd = window.innerWidth < 720 || (navigator.hardwareConcurrency || 8) <= 4;
  const PERF = { prMax: Math.min(2, window.devicePixelRatio || 1), prMin: 0.75, pr: 1, shadow: lowEnd ? 1024 : 2048, shadowEvery: 2, frame: 0, ema: 16.7, slow: 0, good: 0, ceiling: 9, cool: 0, half: 70, force: true, lastT: new THREE.Vector3(1e9, 0, 0), fps: 60, fpsN: 0, fpsT: 0 };
  PERF.pr = PERF.prMax; // cảnh đã nhẹ: máy nào cũng bắt đầu ở độ nét cao nhất, chậm thì bộ điều tốc tự hạ
  const PRESETS = [{ pr: 2, shadow: 2048 }, { pr: 1.5, shadow: 1024 }, { pr: 1, shadow: 0 }, { pr: 0.75, shadow: 0 }];
  let quality = 0, qLocked = false;
  function applyQuality() {
    renderer.setPixelRatio(Math.min(PERF.pr, window.devicePixelRatio || 1));
    const shadows = PERF.shadow > 0;
    if (shadows && sun.shadow.mapSize.x !== PERF.shadow) { sun.shadow.mapSize.set(PERF.shadow, PERF.shadow); if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; } }
    if (renderer.shadowMap.enabled !== shadows) { renderer.shadowMap.enabled = shadows; scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => (m.needsUpdate = true)); }); }
    PERF.force = true;
    resize();
  }
  applyQuality();
  function governQuality(dt) {
    if (qLocked || document.hidden || dt > 250) return;
    const t = performance.now();
    PERF.fpsN++; if (t - PERF.fpsT > 500) { PERF.fps = (PERF.fpsN * 1000) / (t - PERF.fpsT); PERF.fpsN = 0; PERF.fpsT = t; if (fpsOn) $('fps').textContent = Math.round(PERF.fps) + ' khung/giây · nét ' + renderer.getPixelRatio().toFixed(2) + '×' + (PERF.shadow ? '' : ' · tắt bóng'); }
    PERF.ema = PERF.ema * 0.92 + dt * 0.08;
    if (PERF.ema > 19.5) { PERF.slow += dt; PERF.good = 0; }
    else { PERF.slow = Math.max(0, PERF.slow - dt * 0.5); PERF.good = PERF.ema < 17.8 ? PERF.good + dt : 0; }
    if (PERF.slow > 1200) {
      PERF.slow = 0; PERF.ceiling = Math.min(PERF.ceiling, PERF.pr); PERF.cool = t + 45000;
      if (PERF.pr > PERF.prMin + 0.01) PERF.pr = Math.max(PERF.prMin, +(PERF.pr - 0.15).toFixed(2));
      else if (PERF.shadowEvery < 3) PERF.shadowEvery = 3;
      else if (PERF.shadow > 1024) PERF.shadow = 1024;
      else if (PERF.shadow > 0) PERF.shadow = 0;
      else return;
      applyQuality(); PERF.ema = 16.7;
    } else if (PERF.good > 4000) {
      PERF.good = 0;
      if (PERF.shadow === 0) PERF.shadow = 1024;
      else if (PERF.shadow < (lowEnd ? 1024 : 2048)) PERF.shadow = 2048;
      else if (PERF.shadowEvery > 2) PERF.shadowEvery = 2;
      else if (PERF.pr < PERF.prMax - 0.01 && (t > PERF.cool || PERF.pr + 0.1 < PERF.ceiling - 0.01)) { PERF.pr = Math.min(PERF.prMax, +(PERF.pr + 0.1).toFixed(2)); if (t > PERF.cool) PERF.ceiling = 9; }
      else return;
      applyQuality();
    }
  }
  // bóng đổ: vùng bóng theo khoảng cách camera, vẽ lại hai khung một lần hoặc khi chỗ nhìn đổi
  function shadowTick() {
    PERF.frame++;
    if (!renderer.shadowMap.enabled) return;
    const moved = controls.target.distanceToSquared(PERF.lastT) > 0.0004;
    if (moved) PERF.lastT.copy(controls.target);
    const half = clamp(camera.position.distanceTo(controls.target) * 0.62, 26, 80);
    if (Math.abs(half - PERF.half) > 3) { PERF.half = half; const sc = sun.shadow.camera; sc.left = -half; sc.right = half; sc.top = half; sc.bottom = -half; sc.updateProjectionMatrix(); PERF.force = true; }
    renderer.shadowMap.needsUpdate = PERF.force || moved || PERF.frame % PERF.shadowEvery === 0;
    PERF.force = false;
  }

  /* =============== Tốc độ thời gian: 1× (ván chín năm khoảng 72 phút), 2×, 4×; không có tạm dừng =============== */
  let tps = 0.75;
  const speeds = [[0.75, '1×'], [1.5, '2×'], [3, '4×']];
  $('speed').onclick = () => { const i = (speeds.findIndex((x) => x[0] === tps) + 1) % speeds.length; tps = speeds[i][0]; $('speed').textContent = speeds[i][1] + ' ▸'; };
  $('sound').onclick = () => { if (!audio) return; const on = !audio.on; if (on) audio.enable(); else audio.disable(); $('sound').setAttribute('aria-pressed', String(audio.on)); };
  document.addEventListener('keydown', (e) => { if (e.code === 'KeyF' && !e.ctrlKey && !e.metaKey && !typing(e.target)) { fpsOn = !fpsOn; $('fps').hidden = !fpsOn; } });
  function dateText() { const d = Math.floor(W.day), y = Math.floor(d / 360) + 1, doy = d % 360; return 'Năm ' + y + ' · ' + SEASONS[Math.floor(doy / 90)] + ' · Ngày ' + ((doy % 90) + 1); }

  /* =============== Mỗi khung hình =============== */
  let last = performance.now(), lastSlow = 0, lastDate = '';
  updateSeasons(true);
  function frame(t) {
    const dt = Math.min(100, t - last); last = t;
    governQuality(dt);
    tod = (tod + (dt * (tps / 1.5)) / DAY_MS) % 1; // 1×: một vòng ngày đêm 3 phút
    W.day += (dt * tps) / 1000; // logic làng tạm dừng: NPC mẫu không già đi trong lúc huấn luyện cử chỉ
    const { night } = applyTime();
    const doy = ((W.day % 360) + 360) % 360, winter = doy >= 270 ? clamp((doy - 270) / 10, 0, 1) * clamp((360 - doy) / 10, 0, 1) : 0;
    if (t - lastSlow > 1000) {
      lastSlow = t; updateSeasons(false);
      const dt2 = dateText(); if (dt2 !== lastDate) { lastDate = dt2; $('date').textContent = dt2; }
      if (audio && audio.on) audio.setState({ day: 1 - night, night, rain: stormK, snow: winter, festival: 0, panic: 0, drought: 0, winter });
    }
    lands3d.animate(dt, t, night, tod, null, null);
    buildings.animate(dt);
    sea3d.animate(dt, t, night);
    clouds3d.update(dt, t, night); lightFlash = Math.max(0, lightFlash - dt / 200); stormK += (Math.min(1, clouds3d.storms) - stormK) * Math.min(1, dt / 4000);
    updateSnow(dt, t, winter);
    model.update(dt, t); modelUi.render();
    const now = performance.now();
    updatePuffs(now, dt);
    for (const f of floaters) f.m.position.y = f.y + (reduce ? 0 : Math.sin(t * 0.0005 + f.ph) * 1.6);
    if (flyStep(dt)) focusTween = null;
    else if (focusTween) {
      const k = clamp((now - focusTween.t0) / (focusTween.dur || 1200), 0, 1), e = 1 - Math.pow(1 - k, 3);
      const off = camera.position.clone().sub(controls.target);
      controls.target.lerpVectors(focusTween.from, focusTween.target, e);
      if (focusTween.dirTo) off.copy(focusTween.dirFrom).lerp(focusTween.dirTo, e).normalize();
      off.setLength(lerp(focusTween.dist, focusTween.toDist || focusTween.dist, e));
      camera.position.copy(controls.target).add(off);
      if (k >= 1) focusTween = null;
    }
    controls.update();
    shadowTick();
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // móc cho các bài kiểm tra chạy trình duyệt không giao diện
  window.__glass = {
    THREE, W, scene, camera, controls, renderer, lands3d, clouds3d, sea3d,
    buildings,
    ff: (days) => { W.day += days; updateSeasons(true); }, isle, model, modelUi,
    lockQuality: (q) => { quality = q; qLocked = true; PERF.pr = Math.min(PRESETS[q].pr, PERF.prMax); PERF.shadow = PRESETS[q].shadow; applyQuality(); }, perf: PERF,
  };
})();
